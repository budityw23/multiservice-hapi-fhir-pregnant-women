version: "3.7"

services:
  checklist-service:
    build: .
    container_name: fhir-checklist-service
    ports:
      - "8001:8001"
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
    volumes:
      - ./src:/app
    networks:
      - fhir-net
    depends_on:
      - checklist-db

  checklist-db:
    image: postgres:13
    container_name: checklist-db
    environment:
      POSTGRES_DB: checklist
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - checklist-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fhir-net

volumes:
  checklist-data:
    name: checklist-data

networks:
  fhir-net:
    external: true 