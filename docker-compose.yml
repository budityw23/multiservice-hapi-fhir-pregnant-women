version: "3.7"

services:
  # OpenHIM Core
  openhim-core:
    image: jembi/openhim-core:latest
    container_name: openhim-core
    environment:
      - mongo_url=mongodb://openhim-mongo/openhim
      - mongo_atnaUrl=mongodb://openhim-mongo/openhim
      - NODE_ENV=development
      - mongo_host=openhim-mongo
    ports:
      - "8080:8080"  # API HTTP
      - "5000:5000"  # TCP/TLS
      - "5001:5001"  # API TCP
    networks:
      - maternal-net
      - fetal-net
      - obstetric-net
    depends_on:
      - openhim-mongo

  # OpenHIM Console
  openhim-console:
    image: jembi/openhim-console:latest
    container_name: openhim-console
    ports:
      - "9000:80"
    depends_on:
      - openhim-core
    networks:
      - maternal-net
      - fetal-net
      - obstetric-net

  # MongoDB for OpenHIM
  openhim-mongo:
    image: mongo:4.4
    container_name: openhim-mongo
    volumes:
      - openhim-data:/data/db
    networks:
      - maternal-net

  # FHIR Router Mediator
  fhir-router:
    build: ./openhim/mediators/fhir-router
    container_name: fhir-router
    networks:
      - maternal-net
      - fetal-net
      - obstetric-net
    depends_on:
      - openhim-core
      - maternal-fhir
      - fetal-fhir
      - obstetric-fhir

  # Server A - Maternal Health Monitoring
  maternal-fhir:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-fhir
    container_name: maternal-fhir
    ports:
      - "8081:8080"
    networks:
      - maternal-net

  maternal-db:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-db
    container_name: maternal-db
    ports:
      - "5433:5432"
    networks:
      - maternal-net

  maternal-data-generator:
    extends:
      file: ./serverA/docker-compose.yml
      service: data-generator
    container_name: maternal-data-generator
    networks:
      - maternal-net

  # Server B - Fetal Health Monitoring
  fetal-fhir:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-fhir
    container_name: fetal-fhir
    ports:
      - "8082:8080"
    networks:
      - fetal-net

  fetal-db:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-db
    container_name: fetal-db
    ports:
      - "5434:5432"
    networks:
      - fetal-net

  fetal-data-generator:
    extends:
      file: ./serverB/docker-compose.yml
      service: data-generator
    container_name: fetal-data-generator
    networks:
      - fetal-net

  # Server C - Obstetric Care
  obstetric-fhir:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-fhir
    container_name: obstetric-fhir
    ports:
      - "8083:8080"
    networks:
      - obstetric-net

  obstetric-db:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-db
    container_name: obstetric-db
    ports:
      - "5435:5432"
    networks:
      - obstetric-net

  obstetric-data-generator:
    extends:
      file: ./serverC/docker-compose.yml
      service: data-generator
    container_name: obstetric-data-generator
    networks:
      - obstetric-net

volumes:
  maternal-data:
    name: maternal-data
  fetal-data:
    name: fetal-data
  obstetric-data:
    name: obstetric-data
  openhim-data:
    name: openhim-data

networks:
  maternal-net:
    name: maternal-net
  fetal-net:
    name: fetal-net
  obstetric-net:
    name: obstetric-net