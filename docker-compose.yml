version: "3.7"

services:
  # OpenHIM and Mediator Services
  fhir-search-mediator:
    build: ./openhim-mediator-search
    container_name: fhir-search-mediator
    ports:
      - "3000:3000"
    networks:
      - openhim-net
      - fhir-net
    depends_on:
      - openhim-core
      - maternal-fhir
      - fetal-fhir
      - obstetric-fhir
    restart: unless-stopped

  mongo-db:
    container_name: mongo-db
    image: mongo:4.4
    networks:
      - openhim-net
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  openhim-core:
    container_name: openhim-core
    image: jembi/openhim-core:latest
    environment:
      - NODE_ENV=production
      - mongo_url=mongodb://mongo-db/openhim
      - mongo_atnaUrl=mongodb://mongo-db/openhim
      - router_timeout=300000
      - api_protocol=http
      - api_hostname=localhost
      - api_port=8080
      - testing=false
      - trusted_keys_dir=/etc/openhim/tls
      - log_level=info
      - log_outputs='["winston-rest-2.0"]'
      - authentication_type=local
      - tcpAdapter_httpReceiver_port=7786
      - bodyCulling_enabled=true
      - statsd_enabled=false
      - cors_allowedHeaders='["Content-Type", "Authorization"]'
      - cors_allowedDomains='["http://localhost:9000"]'
      - cors_allowedCredentials=true
      - cors_enabled=true
      - tlsClientLookup_type=strict
      - agenda_enable=true
      - authentication_enableMutualTLSAuthentication=false
      - authentication_enableBasicAuthentication=true
      - api_enabled=true
      - ssl_enabled=false
      - ssl_key=false
      - ssl_cert=false
      - cookie_secure=false
      - cookie_maxAge=86400000
      - sessionKey=your-secret-key
      - proxy=true
      - trustProxy=true
      - cookie_sameSite=lax
      - cookie_httpOnly=false
      - cookie_domain=localhost
      - cookie_path=/
    ports:
      - "8080:8080"
      - "5000:5000"
      - "5001:5001"
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - openhim-net
      - fhir-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3

  openhim-console:
    container_name: openhim-console
    image: jembi/openhim-console:latest
    volumes:
      - ./openhim-console/config:/usr/share/nginx/html/config:ro
    environment:
      - OPENHIM_CORE_HOST=localhost
      - OPENHIM_CORE_PORT=8080
      - OPENHIM_CORE_PROTOCOL=http
      - NODE_ENV=development
    ports:
      - "9000:80"
    networks:
      - openhim-net
    depends_on:
      - openhim-core
    restart: unless-stopped

  # Rest of your services remain the same...
  # Server A - Maternal Health Monitoring
  maternal-fhir:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-fhir
    container_name: maternal-fhir
    ports:
      - "8081:8080"
    networks:
      - maternal-net
      - fhir-net
      - openhim-net

  maternal-db:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-db
    container_name: maternal-db
    ports:
      - "5433:5432"
    networks:
      - maternal-net

  maternal-data-generator:
    extends:
      file: ./serverA/docker-compose.yml
      service: data-generator
    container_name: maternal-data-generator
    networks:
      - maternal-net

  # Server B - Fetal Health Monitoring
  fetal-fhir:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-fhir
    container_name: fetal-fhir
    ports:
      - "8082:8080"
    networks:
      - fetal-net
      - fhir-net
      - openhim-net

  fetal-db:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-db
    container_name: fetal-db
    ports:
      - "5434:5432"
    networks:
      - fetal-net

  fetal-data-generator:
    extends:
      file: ./serverB/docker-compose.yml
      service: data-generator
    container_name: fetal-data-generator
    networks:
      - fetal-net

  # Server C - Obstetric Care
  obstetric-fhir:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-fhir
    container_name: obstetric-fhir
    ports:
      - "8083:8080"
    networks:
      - obstetric-net
      - fhir-net
      - openhim-net

  obstetric-db:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-db
    container_name: obstetric-db
    ports:
      - "5435:5432"
    networks:
      - obstetric-net

  obstetric-data-generator:
    extends:
      file: ./serverC/docker-compose.yml
      service: data-generator
    container_name: obstetric-data-generator
    networks:
      - obstetric-net

networks:
  maternal-net:
    name: maternal-net
  fetal-net:
    name: fetal-net
  obstetric-net:
    name: obstetric-net
  fhir-net:
    name: fhir-net
  openhim-net:
    name: openhim-net

volumes:
  maternal-data:
    name: maternal-data
  fetal-data:
    name: fetal-data
  obstetric-data:
    name: obstetric-data
  mongo-data:
    name: mongo-data