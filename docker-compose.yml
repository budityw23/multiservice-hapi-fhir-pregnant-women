version: "3.7"

services:
  # OpenHIM and Mediator Services
  fhir-search-mediator:
    build: ./openhim-mediator-search
    container_name: fhir-search-mediator
    ports:
      - "3000:3000"
    networks:
      - openhim-net
      - fhir-net
    depends_on:
      - openhim-core
      - maternal-fhir
      - fetal-fhir
      - obstetric-fhir
    restart: unless-stopped

  mongo-db:
    container_name: mongo-db
    image: mongo:4.4
    networks:
      - openhim-net
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  openhim-core:
    container_name: openhim-core
    image: jembi/openhim-core:latest
    environment:
      - mongo_url=mongodb://mongo-db/openhim
      - mongo_atnaUrl=mongodb://mongo-db/openhim
      - NODE_ENV=development
      - cors_origin=["http://localhost:9000"]
      - authentication_type=local
      - api_protocol=http
      - api_hostname=localhost
      - api_port=8080
      - "logger_level=info"
      - "router_timeout=5000"
      - "rerun_max_retries=3"
      - "bodyCull_size=2000"
      - "transaction_auto_retry_enabled=true"
      - "auditing_enabled=true"
      - "auditing_max_events_stored=10000"
      - "statsd_enabled=false"
    ports:
      - "8080:8080"
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - mongo-db
    networks:
      - openhim-net
      - fhir-net
    restart: unless-stopped

  openhim-console:
    container_name: openhim-console
    image: jembi/openhim-console:latest
    volumes:
      - ./openhim-console/config:/usr/share/nginx/html/config:ro
    environment:
      - OPENHIM_CORE_HOST=localhost
      - OPENHIM_CORE_PORT=8080
      - OPENHIM_CORE_PROTOCOL=http
      - NODE_ENV=development
    ports:
      - "9000:80"
    networks:
      - openhim-net
    depends_on:
      - openhim-core
    restart: unless-stopped

  # Rest of your services remain the same...
  # Server A - Maternal Health Monitoring
  maternal-fhir:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-fhir
    container_name: maternal-fhir
    ports:
      - "8081:8080"
    networks:
      - maternal-net
      - fhir-net
      - openhim-net

  maternal-db:
    extends:
      file: ./serverA/docker-compose.yml
      service: maternal-db
    container_name: maternal-db
    ports:
      - "5433:5432"
    networks:
      - maternal-net

  maternal-data-generator:
    extends:
      file: ./serverA/docker-compose.yml
      service: data-generator
    container_name: maternal-data-generator
    networks:
      - maternal-net

  # Server B - Fetal Health Monitoring
  fetal-fhir:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-fhir
    container_name: fetal-fhir
    ports:
      - "8082:8080"
    networks:
      - fetal-net
      - fhir-net
      - openhim-net

  fetal-db:
    extends:
      file: ./serverB/docker-compose.yml
      service: fetal-db
    container_name: fetal-db
    ports:
      - "5434:5432"
    networks:
      - fetal-net

  fetal-data-generator:
    extends:
      file: ./serverB/docker-compose.yml
      service: data-generator
    container_name: fetal-data-generator
    networks:
      - fetal-net

  # Server C - Obstetric Care
  obstetric-fhir:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-fhir
    container_name: obstetric-fhir
    ports:
      - "8083:8080"
    networks:
      - obstetric-net
      - fhir-net
      - openhim-net

  obstetric-db:
    extends:
      file: ./serverC/docker-compose.yml
      service: obstetric-db
    container_name: obstetric-db
    ports:
      - "5435:5432"
    networks:
      - obstetric-net

  obstetric-data-generator:
    extends:
      file: ./serverC/docker-compose.yml
      service: data-generator
    container_name: obstetric-data-generator
    networks:
      - obstetric-net

networks:
  maternal-net:
    name: maternal-net
  fetal-net:
    name: fetal-net
  obstetric-net:
    name: obstetric-net
  fhir-net:
    name: fhir-net
  openhim-net:
    name: openhim-net

volumes:
  maternal-data:
    name: maternal-data
  fetal-data:
    name: fetal-data
  obstetric-data:
    name: obstetric-data
  mongo-data:
    name: mongo-data