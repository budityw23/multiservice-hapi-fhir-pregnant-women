services:
  maternal-fhir: # Changed from hapi-fhir to maternal-fhir to match BASE_URL
    image: "hapiproject/hapi:latest"
    container_name: maternal-fhir
    ports:
      - "8081:8080"
    environment:
      SPRING_CONFIG_LOCATION: file:///config/application.yaml
    volumes:
      - ./config:/config
    depends_on:
      - maternal-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - maternal-network

  maternal-db: # Changed from postgres-db to maternal-db
    image: postgres:13
    container_name: maternal-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - maternal-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  data-generator:
    build: ./data-generator
    container_name: maternal-data-generator
    depends_on:
      - maternal-fhir
    networks:
      - maternal-network

  # Add OpenHIM Core
  openhim-core:
    image: jembi/openhim-core:latest
    container_name: openhim-core
    environment:
      - mongo_url=mongodb://openhim-mongo/openhim
      - mongo_atnaUrl=mongodb://openhim-mongo/openhim
      - NODE_ENV=development
      - mongo_host=openhim-mongo
    ports:
      - "8080:8080"  # HTTP API port
      - "5000:5000"  # TCP/TLS port for ATNA audit events
      - "5001:5001"  # API TCP port
    depends_on:
      - openhim-mongo
    networks:
      - maternal-network

  # OpenHIM Console (Web Interface)
  openhim-console:
    image: jembi/openhim-console:latest
    container_name: openhim-console
    ports:
      - "9000:80"
    depends_on:
      - openhim-core
    networks:
      - maternal-network

  # MongoDB for OpenHIM
  openhim-mongo:
    image: mongo:4.4
    container_name: openhim-mongo
    volumes:
      - openhim-data:/data/db
    networks:
      - maternal-network

  fhir-mediator:
    build: ./mediators/fhir-mediator
    container_name: fhir-mediator
    depends_on:
      - openhim-core
      - maternal-fhir
    networks:
      - maternal-network

volumes:
  maternal-data:
    name: maternal-data
  openhim-data:
    name: openhim-data

networks:
  maternal-network:
    name: maternal-network
